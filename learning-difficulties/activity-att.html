<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المهمة ٤ · محاكاة الانتباه</title>
<style>

/* Layout idea: fixed 1920×1080 stage on light paper; each section of the research map keeps one accent colour, tinted panels instead of dark blocks. */
:root{
  --ink:#1B2B66; --ink-2:#38456B; --muted:#5D6A8C; --paper:#F3F8FE; --navy:#1D3275; --gold:#D4A017; --sky:#E4F0FC; --card:#FFFFFF; --line:#DCE2EE;
  --blue:#2160C4; --orange:#C9601A; --red:#C93745; --purple:#6C45C2; --green:#16865A; --teal:#0A7E8F; --goldtxt:#8A5E00;
  --ok:#16865A; --bad:#C93745;
  --display:"Tajawal",Tahoma,"Segoe UI",sans-serif;
  --body:"Tajawal",Tahoma,"Segoe UI",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#DCE3EF;color:var(--ink);font-family:var(--body);overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[contenteditable]:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #F2B705;outline-offset:3px}
#viewport{position:fixed;inset:0}
#stage{position:absolute;width:1920px;height:1080px;left:50%;top:50%;transform-origin:center center;background:var(--paper);overflow:hidden;box-shadow:0 20px 60px rgba(26,35,64,.18)}
.slide{position:absolute;inset:0;padding:80px 120px 116px;display:none;flex-direction:column;gap:30px;font-size:30px;line-height:1.55;--acc:var(--blue);background:linear-gradient(180deg,#DDEBFB 0%,#EEF5FD 30%,#FAFCFF 100%)}
.slide.active{display:flex}
.slide::before{content:"";position:absolute;top:0;right:0;width:100%;height:12px;background:var(--navy);border-bottom:4px solid var(--gold)}
.slide h1,.slide h2,.slide h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
.slide h2{font-size:64px;font-weight:800;color:var(--navy)}
.slide h3{font-size:34px;font-weight:700}
.slide p{margin:0}
.head{display:flex;flex-direction:column;gap:10px}
.tint{background:color-mix(in srgb,var(--acc) 9%,white)}
.tag{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:linear-gradient(180deg,#24408F,#1D3275);color:#fff;font-family:var(--display);font-weight:700;font-size:26px;padding:8px 24px 6px 20px;border-radius:999px;border:3px solid var(--gold);box-shadow:0 6px 16px rgba(29,50,117,.18)}
.tag svg{width:30px;height:30px;color:#F2C94C}
.lead{font-size:31px;color:var(--ink-2);max-width:1600px}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grid{display:grid;gap:24px}
.card{background:var(--card);border:1px solid #D7E4F5;box-shadow:0 8px 24px rgba(29,50,117,.07);border-radius:26px;padding:26px 30px;display:flex;flex-direction:column;gap:10px}
.card h3{color:var(--acc)}
.card .ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--acc) 22%,white));color:var(--acc);box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 22%,transparent)}
.card .ic svg{width:36px;height:36px}
.card ul,.card ol{margin:0;padding:0 30px 0 0;display:flex;flex-direction:column;gap:8px}
.card li::marker{color:var(--acc)}
.src{font-size:22px;color:var(--muted)}
.foot{position:absolute;left:120px;right:120px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-size:22px;color:var(--navy);font-weight:700;font-family:var(--display)}
.foot .bar{height:6px;flex:1;margin:0 32px;background:var(--line);border-radius:3px;overflow:hidden}
.foot .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));border-radius:3px}
.btn{border:0;border-radius:14px;padding:14px 28px 12px;font-size:28px;font-weight:700;background:var(--acc);color:#fff;display:inline-flex;align-items:center;gap:12px;transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.ghost{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 3px var(--acc)}
.btn svg{width:30px;height:30px}
.pill{display:inline-block;align-self:flex-start;padding:5px 16px 3px;border-radius:999px;font-size:23px;font-weight:700;background:color-mix(in srgb,var(--acc) 12%,white);color:var(--acc)}
[contenteditable]{border-bottom:2px dashed color-mix(in srgb,var(--acc) 45%,transparent);min-width:3ch;display:inline-block;padding:0 4px;border-radius:4px}
[contenteditable]:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.task-badge{display:inline-flex;align-items:center;gap:10px;background:#FFF1C9;color:var(--ink);padding:8px 22px 6px;border-radius:999px;font-size:25px;font-family:var(--display);font-weight:700;align-self:flex-start;border:2px solid #F2C94C}
.task-badge b{color:#8A5A00}
.k{font-family:var(--display);font-weight:800;color:var(--acc)}
.ltr{direction:ltr;unicode-bidi:isolate}

.slide.active .a{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 100ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.slide.active .z{animation:zoom .75s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 100ms)}
@keyframes zoom{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.slide.active .a,.slide.active .z{animation:none}*{transition:none!important}}

/* Chrome */
#chrome{position:fixed;top:14px;left:14px;display:flex;gap:6px;align-items:center;background:rgba(26,35,64,.82);backdrop-filter:blur(8px);padding:6px 8px;border-radius:14px;z-index:20;opacity:.3;transition:opacity .25s}
#chrome:hover,#chrome:focus-within{opacity:1}
#chrome button{background:transparent;border:0;color:#fff;width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
#chrome button:hover{background:rgba(255,255,255,.14)}
#chrome svg{width:22px;height:22px}
#counter{color:#fff;font-family:var(--display);font-size:16px;min-width:64px;text-align:center}
#notes{position:fixed;left:16px;top:74px;width:min(540px,90vw);max-height:46vh;overflow:auto;background:#fff;border-radius:16px;padding:18px 22px;font-size:19px;line-height:1.75;box-shadow:0 20px 50px rgba(26,35,64,.3);display:none;z-index:21;font-family:var(--body)}
#notes.show{display:block}
#notes h4{margin:0 0 6px;font-family:var(--display);color:var(--purple);font-size:21px}
#overview{position:fixed;inset:0;background:rgba(240,244,250,.97);z-index:30;display:none;overflow:auto;padding:40px}
#overview.show{display:block}
#overview .og{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;max-width:1500px;margin:0 auto}
#overview button{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:right;font-size:18px;font-family:var(--display);font-weight:500;display:flex;gap:12px;align-items:flex-start;line-height:1.5}
#overview button b{color:var(--blue);min-width:28px}
#overview button.cur{border-color:var(--blue)}
#overview h3{color:var(--ink);font-family:var(--display);text-align:center;margin:0 0 24px;font-size:26px}

/* Cover */
.cover{padding:0;background:linear-gradient(120deg,#FFFFFF 0%,#F2F6FD 55%,#FFF6E3 100%)}
.cover.active{display:grid;grid-template-columns:1fr 780px}
.cover::before{display:none}
.cover .txt{padding:80px 130px 80px 40px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.cover .logo{height:132px;width:auto;align-self:flex-start;margin-bottom:6px}
.cover .eyebrow{font-family:var(--display);font-weight:700;font-size:28px;color:var(--blue);display:flex;gap:12px;align-items:center}
.cover .eyebrow::before{content:"";width:56px;height:6px;border-radius:3px;background:#F2B705}
.cover h1{font-size:132px;font-weight:800;color:var(--ink);line-height:1.05}
.cover h1 span{color:var(--blue)}
.cover .sub{font-size:37px;color:var(--ink-2);font-family:var(--display);font-weight:500;max-width:960px;line-height:1.45}
.cover .meta{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:29px;color:var(--ink);margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 30px;max-width:820px}
.cover .meta span:nth-child(odd){color:var(--muted);font-weight:700}
.cover .art{position:relative;background:linear-gradient(160deg,#E4EDFB,#F7F0FF 60%,#FFF3D6)}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}

/* Myths */
.myths{grid-template-columns:repeat(4,1fr);flex:1}
.flip{perspective:1600px;border:0;background:none;padding:0;text-align:right;font-size:inherit;color:inherit}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:40px 34px;display:flex;flex-direction:column;gap:20px;justify-content:center}
.flip .f{background:var(--card);border:1px solid var(--line)}
.flip .f .q{font-size:40px;font-family:var(--display);font-weight:700;line-height:1.45;color:var(--ink)}
.flip .f .hint{position:absolute;bottom:34px;color:var(--acc);font-weight:700;font-size:26px;display:flex;gap:10px;align-items:center}
.flip .b{background:#FDEEF0;border:3px solid var(--acc);transform:rotateY(180deg)}
.flip .b .v{font-family:var(--display);font-size:56px;font-weight:800;color:var(--acc)}
.flip .b p{font-size:29px;color:var(--ink)}
.flip .b small{font-size:21px;color:var(--muted)}
.flip .num{font-family:var(--display);font-size:84px;color:color-mix(in srgb,var(--acc) 28%,white);font-weight:800;line-height:1}

/* Agenda */
.agenda{grid-template-columns:repeat(3,1fr);gap:18px}
.agenda button{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 22px;font-size:28px;font-family:var(--display);font-weight:700;color:var(--ink);text-align:right;transition:transform .15s,border-color .15s;line-height:1.3}
.agenda button small{display:block;font-size:21px;color:var(--muted);font-weight:500;margin-top:2px}
.agenda button:hover{transform:translateY(-3px);border-color:var(--c)}
.agenda .n{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,white);color:var(--c);font-weight:800;font-size:28px;flex:none}

/* Reasons */
.reasons{grid-template-columns:560px 1fr;flex:1}
.bigstat{background:#FDEEF0;border:1px solid #F5CDD2;border-radius:28px;padding:34px 40px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.bigstat .n{font-family:var(--display);font-size:118px;font-weight:800;color:var(--red);line-height:1;text-align:right}
.bigstat .n2{font-family:var(--display);font-size:80px;font-weight:800;color:var(--goldtxt);line-height:1;text-align:right;margin-top:10px}
.bigstat p{font-size:26px;color:var(--ink)}
.r4{grid-template-columns:1fr 1fr;gap:20px}
.r4 .card{padding:22px 26px;gap:6px}
.r4 .card p{font-size:24.5px;line-height:1.5;color:var(--ink-2)}
.r4 .card h3{font-size:31px}

/* Definition */
.defgrid{grid-template-columns:1.3fr 1fr;flex:1}
.quote{background:var(--card);border:1px solid var(--line);border-right:10px solid var(--acc);border-radius:20px;padding:22px 30px;font-size:27px;line-height:1.55}
.quote b.h{font-family:var(--display);color:var(--acc);display:block;font-size:28px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-size:25px;display:flex;flex-direction:column;line-height:1.3}
.chip b{font-family:var(--display);color:var(--ink)}
.chip small{font-size:20px;color:var(--muted);direction:ltr;text-align:right}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lv{border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;font-size:23px;line-height:1.45;border:2px solid}
.lv b{font-family:var(--display);font-size:30px}

/* UAE classification */
.uae{grid-template-columns:1fr 1fr;flex:1}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:25px;display:flex;gap:12px;align-items:center;font-family:var(--display);font-weight:500}
.cats div i{font-style:normal;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--paper);color:var(--muted);font-weight:800;flex:none}
.cats div.hl{background:color-mix(in srgb,var(--acc) 12%,white);border:3px solid var(--acc);font-weight:800;color:var(--acc)}
.cats div.hl i{background:var(--acc);color:#fff}
.uaeside{display:flex;flex-direction:column;gap:18px}

/* Criteria */
.crit{grid-template-columns:repeat(4,1fr);gap:20px;flex:1.3}
.methods{flex:1}
.cr{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.cr .L{font-family:var(--display);font-size:64px;font-weight:800;color:color-mix(in srgb,var(--acc) 30%,white);line-height:1;position:absolute;left:20px;top:14px}
.cr h3{color:var(--acc);font-size:32px}
.cr p{font-size:27px;line-height:1.5;color:var(--ink-2)}
.methods{grid-template-columns:1fr 1fr 1.1fr;gap:20px}
.methods .card p{font-size:27px;line-height:1.5;color:var(--ink-2)}
.methods .card h3{font-size:30px}

/* Timeline */
.tl{position:relative;height:130px;margin-top:6px}
.tl .rail{position:absolute;top:76px;left:0;right:0;height:6px;background:var(--line);border-radius:3px}
.tl .fill{position:absolute;top:76px;right:0;height:6px;background:var(--acc);border-radius:3px;transition:width .5s}
.tl button{position:absolute;top:50px;transform:translateX(50%);width:58px;height:58px;border-radius:50%;border:5px solid var(--paper);background:var(--line);transition:background .2s, transform .2s}
.tl button.on{background:var(--acc);transform:translateX(50%) scale(1.18)}
.tl button.past{background:color-mix(in srgb,var(--acc) 50%,white)}
.tl .yr{position:absolute;top:0;transform:translateX(50%);font-family:var(--display);font-weight:700;font-size:26px;color:var(--muted);white-space:nowrap}
.tl .yr.on{color:var(--acc)}
.tldetail{display:grid;grid-template-columns:300px 1fr;gap:44px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:40px 50px;flex:1;align-items:center}
.tldetail .y{font-family:var(--display);font-size:124px;font-weight:800;color:var(--acc);line-height:1}
.tldetail .where{font-size:24px;color:var(--muted);font-weight:700;margin-top:10px;font-family:var(--display)}
.tldetail h3{font-size:44px;margin-bottom:12px}
.tldetail p{font-size:31px;color:var(--ink-2);line-height:1.6}
.tlnav{display:flex;gap:14px;align-items:center}
.tlnav .src{margin-right:auto}

/* Causes */
.causes{grid-template-columns:repeat(4,1fr);gap:20px}
.causes .card p, .causes .card li{font-size:24.5px;line-height:1.5;color:var(--ink-2)}
.causes .card .big{font-family:var(--display);font-weight:800;font-size:46px;color:var(--acc);line-height:1.1}
.notcause{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;border-radius:22px;padding:22px 30px;background:#FFF6E0;border:1px solid #F2D79A;font-size:26px}
.notcause b{font-family:var(--display);color:#8A5A00;font-size:30px;white-space:nowrap}

/* Tabs */
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 26px 8px;font-size:27px;font-family:var(--display);font-weight:700;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.tabs button svg{width:28px;height:28px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.panel{display:none;grid-template-columns:1fr 540px;gap:40px;flex:1;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:40px 48px}
.panel.on{display:grid;animation:rise .5s both}
.panel ul{margin:0;padding:0 34px 0 0;display:flex;flex-direction:column;gap:18px;font-size:31px;justify-content:center;line-height:1.5}
.panel li::marker{color:var(--acc)}
.panel .side{background:color-mix(in srgb,var(--acc) 8%,white);border-radius:20px;padding:32px;display:flex;flex-direction:column;justify-content:center;gap:14px;font-size:27px;line-height:1.55}
.panel .side b{font-family:var(--display);color:var(--acc);font-size:30px}

/* Types */
.types{grid-template-columns:repeat(3,1fr);flex:1;gap:22px}
.type{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.type .th{padding:22px 28px 18px;background:color-mix(in srgb,var(--c) 10%,white);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}
.type .th .ic{width:62px;height:62px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.type .th .ic svg{width:36px;height:36px}
.type .th h3{color:var(--c);font-size:34px}
.type .th small{display:block;font-size:21px;color:var(--muted);direction:ltr;text-align:right;font-family:var(--body);font-weight:500}
.type .bd{padding:20px 28px;display:flex;flex-direction:column;gap:12px;font-size:24px;line-height:1.5;color:var(--ink-2)}
.type .bd b{font-family:var(--display);color:var(--ink);font-size:25px}
.type ul{margin:0;padding:0 26px 0 0;display:flex;flex-direction:column;gap:5px}
.type li::marker{color:var(--c)}

/* Classification tree */
.cls{grid-template-columns:530px 1fr;grid-template-rows:minmax(0,1fr);gap:40px;flex:1;min-height:0}
.tree{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px 34px;display:flex;flex-direction:column;align-items:center}
.troot{background:var(--acc);color:#fff;font-family:var(--display);font-weight:800;font-size:36px;padding:14px 40px 10px;border-radius:18px;text-align:center;line-height:1.3}
.troot small{display:block;font-size:21px;font-weight:500;opacity:.9}
.tbr{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;width:100%;position:relative;padding-top:56px}
.tbr::before{content:"";position:absolute;top:0;right:50%;width:4px;height:28px;background:color-mix(in srgb,var(--acc) 45%,white)}
.tbr::after{content:"";position:absolute;top:28px;right:27%;left:22%;height:4px;background:color-mix(in srgb,var(--acc) 45%,white);border-radius:2px}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.tb::before{content:"";position:absolute;top:-28px;right:50%;width:4px;height:28px;background:color-mix(in srgb,var(--acc) 45%,white)}
.tmid{background:color-mix(in srgb,var(--acc) 12%,white);border:3px solid var(--acc);color:var(--acc);font-family:var(--display);font-weight:800;font-size:30px;padding:8px 26px 4px;border-radius:16px}
.tsubs{display:flex;gap:14px;width:100%;justify-content:center}
.tsub{flex:1;border:2px dashed color-mix(in srgb,var(--acc) 40%,white);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:9px}
.tsub b{font-family:var(--display);font-size:26px;color:var(--ink);text-align:center}
.tsub span{background:var(--paper);border-radius:12px;padding:6px 12px 4px;font-size:25px;text-align:center}
.tlink{margin-top:20px;align-self:stretch;display:flex;gap:10px;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:25px;color:var(--ink-2);background:var(--paper);border-radius:12px;padding:10px}
.tlink svg{width:26px;height:26px;color:var(--acc)}
.clsside{display:flex;flex-direction:column;gap:16px}
.clsside .card{padding:20px 26px;gap:8px}
.clsside .card p{font-size:26px;line-height:1.5;color:var(--ink-2)}
.sev{display:flex;flex-direction:column;gap:8px}
.sev .row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:14px;font-size:22px;color:var(--ink-2)}
.sev .row b{font-family:var(--display);font-size:25px;color:var(--ink)}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ages div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:23px;line-height:1.4;color:var(--ink-2)}
.ages b{display:block;font-family:var(--display);font-size:24px;color:var(--acc)}

/* Divider */
.divider{justify-content:center;align-items:flex-start;padding:110px 160px;background:linear-gradient(120deg,#FFF8E6,#FFFFFF 60%,#EEF4FF)}
.divider h2{font-size:132px;color:var(--ink)}
.divider .k{font-size:34px;color:#8A5A00}
.divider p{font-size:38px;color:var(--ink-2);max-width:1350px}
.divider .steps{display:flex;gap:20px;margin-top:26px}
.divider .steps div{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 28px 16px;font-family:var(--display);font-weight:700;font-size:29px;display:flex;gap:14px;align-items:center;color:var(--ink)}
.divider .steps svg{width:38px;height:38px;color:#C98A00}
.divider .rule{font-size:28px;color:var(--muted);margin-top:16px}

/* Simulation shared */
.sim{display:grid;grid-template-columns:1fr 470px;gap:34px;flex:1;min-height:0}
.simbox{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:40px 48px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:22px}
.simside{display:flex;flex-direction:column;gap:18px}
.timer{font-family:var(--display);font-size:84px;font-weight:800;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.how{background:color-mix(in srgb,var(--acc) 8%,white);border-radius:20px;padding:22px 26px;font-size:24.5px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.how b{font-family:var(--display);color:var(--acc);font-size:27px}
.opts{display:flex;flex-direction:column;gap:12px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 22px 10px;font-size:27px;text-align:right;color:var(--ink);transition:border-color .2s, background .2s;font-weight:500}
.opts button:hover{border-color:var(--acc)}
.opts button.right{background:#E2F4EB;border-color:var(--ok)}
.opts button.wrong{background:#FBE4E7;border-color:var(--bad)}
.feedback{font-size:27px;font-weight:700;min-height:42px}
#dysText{font-size:48px;line-height:2.05;color:var(--ink)}
#dysText span{display:inline-block}
#dysText span.w1{transform:translateY(-3px) rotate(-1.2deg);filter:blur(.6px)}
#dysText span.w2{transform:translateX(4px);letter-spacing:4px}
#dysText.support{letter-spacing:1.5px;word-spacing:14px;line-height:2.3}
.veil{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(255,255,255,.96);text-align:center}
.veil>div{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:900px}
.veil h3{font-size:44px}
#mirrorWrap{position:relative;flex:1;border-radius:20px;overflow:hidden;background:#FBFCFE;border:2px dashed var(--line);cursor:crosshair;touch-action:none}
#mirror{position:absolute;inset:0;width:100%;height:100%}
.seg{display:flex;gap:10px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 18px 6px;font-size:24px;color:var(--ink-2);font-weight:700}
.seg button.on{border-color:var(--acc);color:var(--acc)}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend div{background:color-mix(in srgb,var(--acc) 10%,white);border:2px solid color-mix(in srgb,var(--acc) 35%,white);color:var(--ink);border-radius:16px;padding:10px 22px 6px;font-size:30px;font-family:var(--display);font-weight:700}
.legend b{color:var(--acc);font-size:42px;padding:0 6px}
.eq{font-family:var(--display);font-size:130px;font-weight:800;text-align:center;direction:ltr;color:var(--ink);line-height:1.1}
.mopts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mopts button{font-family:var(--display);font-size:56px;font-weight:800;border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px 14px 8px;color:var(--ink)}
.mopts button:hover{border-color:var(--acc)}
.mopts button.right{background:#E2F4EB;border-color:var(--ok)}
.mopts button.wrong{background:#FBE4E7;border-color:var(--bad)}
.qbar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--acc);width:100%}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.cur{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 40%,transparent)}
#attBox{justify-content:center}
#attSentence{font-size:50px;line-height:2;position:relative;z-index:2}
.distr{position:absolute;z-index:3;pointer-events:none;font-family:var(--display);font-weight:700;border-radius:14px;padding:10px 18px 6px;font-size:28px;animation:pop 2.6s ease-in-out both}
@keyframes pop{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.floaty{position:absolute;z-index:1;border-radius:50%;opacity:.5;animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(260px,140px)}}
.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.numpad button{font-family:var(--display);font-size:40px;font-weight:800;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px 8px 4px;color:var(--ink)}
.numpad button.right{background:#E2F4EB;border-color:var(--ok)}
.numpad button.wrong{background:#FBE4E7;border-color:var(--bad)}
mark.ain{background:#FFE08A;border-radius:6px;padding:0 2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--display);font-weight:700;font-size:24px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 18px;color:var(--ink)}
.toggle i{width:58px;height:32px;border-radius:16px;background:var(--line);position:relative;transition:background .2s;flex:none}
.toggle i::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s}
.toggle.on i{background:var(--acc)}
.toggle.on i::after{right:30px}

/* Reflection */
.feel{grid-template-columns:repeat(3,1fr);flex:1}
.fc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;gap:14px}
.fc .top{display:flex;justify-content:space-between;align-items:center}
.fc .w{font-family:var(--display);font-size:44px;font-weight:800;color:var(--c)}
.fc .cnt{font-family:var(--display);font-size:64px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.fc .bar{height:18px;background:var(--line);border-radius:9px;overflow:hidden}
.fc .bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .35s}
.fc .ctl{display:flex;gap:10px}
.fc .ctl button{width:64px;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:34px;font-weight:800;color:var(--ink)}
.fc .ctl button.plus{background:var(--c);border-color:var(--c);color:#fff;flex:1}
.fat{background:#FFF6E0;border:1px solid #F2D79A;border-radius:22px;padding:22px 32px;font-size:28px;display:flex;gap:20px;align-items:center;color:var(--ink)}
.fat b{color:#8A5A00;font-family:var(--display)}

/* Needs */
.needs{grid-template-columns:repeat(5,1fr);flex:1}
.needs .card{padding:24px 22px}
.needs .card h3{font-size:30px}
.needs ul{font-size:25px;line-height:1.45;color:var(--ink-2)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.roles div{border-radius:20px;padding:18px 28px;font-size:25px;background:color-mix(in srgb,var(--acc) 9%,white);border:1px solid color-mix(in srgb,var(--acc) 25%,white);color:var(--ink);display:flex;gap:18px;align-items:center;line-height:1.5}
.roles b{color:var(--acc);font-family:var(--display);font-size:30px;white-space:nowrap}

/* RTI */
.rti{display:grid;grid-template-columns:860px 1fr;gap:40px;flex:1;min-height:0}
.pyr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.pyr button{border:0;color:#fff;font-family:var(--display);font-weight:800;font-size:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;transition:transform .2s, filter .2s;clip-path:polygon(var(--l) 0,calc(100% - var(--l)) 0,100% 100%,0 100%);opacity:.55}
.pyr button small{font-size:23px;font-weight:500}
.pyr button.on{opacity:1;transform:scale(1.03)}
.rtid{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:36px 42px;display:flex;flex-direction:column;gap:16px}
.rtid h3{font-size:40px}
.rtid dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:12px 20px;font-size:26px;line-height:1.5}
.rtid dt{font-family:var(--display);font-weight:800}
.rtid dd{margin:0;color:var(--ink-2)}

/* Strategies */
.strat{grid-template-columns:repeat(3,1fr);gap:20px;flex:1}
.strat .card{padding:22px 26px;gap:6px}
.strat .card h3{font-size:30px}
.strat .card p{font-size:26.5px;line-height:1.5;color:var(--ink-2)}
.strat .card .eg{font-size:23px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.es{font-family:var(--display);font-weight:800;font-size:22px;background:color-mix(in srgb,var(--acc) 12%,white);color:var(--acc);border-radius:999px;padding:4px 12px 2px;white-space:nowrap}

/* Tech catalog */
.tech{display:grid;grid-template-columns:1fr 640px;gap:32px;flex:1;min-height:0}
.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start}
.tcards button{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:right;font-family:var(--display);font-size:26px;font-weight:700;color:var(--ink);transition:border-color .2s, transform .2s;line-height:1.3}
.tcards button:hover{transform:translateY(-3px)}
.tcards button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,white)}
.tcards button .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 12%,white);color:var(--acc)}
.tcards button .ic svg{width:30px;height:30px}
.tcards button small{font-family:var(--body);font-weight:500;font-size:20px;color:var(--muted)}
.tdetail{background:color-mix(in srgb,var(--acc) 8%,white);border:2px solid color-mix(in srgb,var(--acc) 30%,white);border-radius:26px;padding:36px 40px;display:flex;flex-direction:column;gap:16px}
.tdetail h3{color:var(--ink);font-size:40px}
.tdetail .lvl{align-self:flex-start;background:var(--acc);color:#fff;padding:4px 16px 2px;border-radius:999px;font-size:22px;font-weight:700;font-family:var(--display)}
.tdetail dl{margin:0;display:grid;grid-template-columns:140px 1fr;gap:14px 18px;font-size:25.5px;line-height:1.5}
.tdetail dt{color:var(--acc);font-family:var(--display);font-weight:800}
.tdetail dd{margin:0;color:var(--ink)}
.cont{display:flex;align-items:center;gap:16px;font-family:var(--display);font-weight:700;font-size:23px;color:var(--muted)}
.cont .g{flex:1;height:14px;border-radius:7px;background:linear-gradient(to left,#BFE3E8,var(--teal))}

/* SETT */
.sett{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}
.sq{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 30px;display:flex;flex-direction:column;gap:10px;position:relative}
.sq .L{position:absolute;left:22px;top:16px;font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:color-mix(in srgb,var(--c) 30%,white);direction:ltr}
.sq h3{color:var(--c);font-size:32px}
.sq h3 small{font-size:21px;color:var(--muted);font-weight:500;display:block;font-family:var(--body)}
.sq ul{margin:0;padding:0 28px 0 0;font-size:28px;line-height:1.5;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.sq li::marker{color:var(--c)}
.sq .ex{display:none;font-size:29px;line-height:1.55;color:var(--ink);background:color-mix(in srgb,var(--c) 8%,white);border-radius:14px;padding:12px 18px}
.sett.case .sq ul{display:none}
.sett.case .sq .ex{display:block}
.setttop{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}

/* Reader demo */
.reader{display:grid;grid-template-columns:420px 1fr;gap:34px;flex:1;min-height:0}
.tools{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:20px}
.tool{display:flex;flex-direction:column;gap:6px;font-size:24px}
.tool label{font-family:var(--display);font-weight:700;color:var(--ink)}
.tool input[type=range]{width:100%;accent-color:var(--teal);height:30px}
.swatches{display:flex;gap:12px}
.swatches button{width:58px;height:58px;border-radius:14px;border:3px solid var(--line)}
.swatches button.on{border-color:var(--ink)}
.page{position:relative;border-radius:24px;border:1px solid var(--line);padding:50px 60px;overflow:hidden;transition:background .3s}
#readText{color:var(--ink);transition:font-size .2s, line-height .2s, letter-spacing .2s, word-spacing .2s}
#readText .wd{border-radius:6px;transition:background .15s}
#readText .wd.hl{background:#FFD166}
#ruler{position:absolute;left:0;right:0;height:96px;pointer-events:none;box-shadow:0 0 0 2000px rgba(26,35,64,.35);border-top:3px solid #F2B705;border-bottom:3px solid #F2B705;display:none}
.page.ruler #ruler{display:block}

/* Videos */
.vids{grid-template-columns:repeat(3,1fr);flex:1}
.vid{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);transition:transform .2s, box-shadow .2s}
.vid:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(26,35,64,.12)}
.vid .th{height:280px;position:relative;display:grid;place-items:center;overflow:hidden}
.vid .th svg.bg{position:absolute;inset:0;width:100%;height:100%}
.vid .play{width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative;z-index:2;box-shadow:0 10px 30px rgba(26,35,64,.2)}
.vid .play svg{width:46px;height:46px;color:var(--red);fill:var(--red);stroke:none;margin-left:-6px}
.vid .dur{position:absolute;bottom:16px;left:16px;background:rgba(26,35,64,.75);color:#fff;font-size:20px;padding:2px 12px;border-radius:8px;z-index:2;direction:ltr}
.vid .bd{padding:22px 28px;display:flex;flex-direction:column;gap:10px;flex:1}
.vid h3{font-size:32px;color:var(--ink)}
.vid p{font-size:24px;color:var(--ink-2);line-height:1.5}
.vid .go{margin-top:auto;color:var(--red);font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px}
.vid .q{background:color-mix(in srgb,var(--red) 7%,white);border-radius:12px;padding:10px 14px;font-size:22px;color:var(--ink-2)}

/* Studies */
.studies{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px;flex:1}
.st{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 30px;align-content:center;display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:start}
.st .es2{font-family:var(--display);font-weight:800;font-size:58px;color:var(--acc);line-height:1.05;text-align:center}
.st .es2 small{display:block;font-size:19px;color:var(--muted);font-weight:500;line-height:1.3;margin-top:4px}
.st b{font-family:var(--display);font-size:30px;display:block;line-height:1.35}
.st p{font-size:25.5px;color:var(--ink-2);line-height:1.5;margin-top:6px}
.st .who{font-size:19px;color:var(--muted);direction:ltr;text-align:right;margin-top:6px}
.st .who.ar{direction:rtl}
.arab{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;flex:1}
.arab .card p, .arab .card li{font-size:25.5px;line-height:1.5;color:var(--ink-2)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats3 div{background:color-mix(in srgb,var(--acc) 8%,white);border-radius:16px;padding:12px 14px;text-align:center;font-size:21px;line-height:1.35;color:var(--ink-2)}
.stats3 b{display:block;font-family:var(--display);font-size:46px;color:var(--acc);line-height:1.1}
.lessons{grid-template-columns:1fr 1fr;flex:1}
.lessons ol,.lessons ul{font-size:31px;gap:18px;line-height:1.5}

/* Visit */
.visit{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;flex:1;min-height:0}
.vframe{background:color-mix(in srgb,var(--acc) 7%,white);border:2px solid color-mix(in srgb,var(--acc) 25%,white);border-radius:26px;overflow:hidden;position:relative;display:grid;place-items:center}
.vframe video{width:100%;height:100%;object-fit:contain;background:#000;display:none}
.vframe.has{background:#000}
.vframe.has video{display:block}
.vframe.has .drop{display:none}
.vchange{position:absolute;top:18px;right:18px;z-index:3;display:none;align-items:center;gap:8px;border:0;border-radius:12px;padding:8px 16px;font-size:20px;background:rgba(255,255,255,.92);color:var(--ink);font-weight:700}
.vchange svg{width:22px;height:22px}
.vframe.has .vchange{display:flex}
.drop{border:3px dashed color-mix(in srgb,var(--acc) 40%,white);border-radius:22px;margin:36px;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink-2);text-align:center;font-size:27px;padding:30px;cursor:pointer}
.drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,white)}
.drop svg.big{width:110px;height:110px;color:var(--acc)}
.vinfo{display:flex;flex-direction:column;gap:12px}
.field{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 22px;font-size:25px;line-height:1.45;display:flex;flex-direction:column;gap:2px}
.field label{font-family:var(--display);font-weight:800;color:var(--acc);font-size:23px}
.field [contenteditable]{display:block;border-bottom:none;min-height:1.5em}
.obs{margin:0;padding:0 26px 0 0;display:flex;flex-direction:column;gap:4px}

/* Gap */
.gapwrap{display:grid;grid-template-columns:1fr 420px;gap:32px;flex:1;min-height:0}
table.gap{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;font-size:24.5px}
table.gap th{background:color-mix(in srgb,var(--acc) 12%,white);color:var(--ink);font-family:var(--display);font-weight:800;text-align:right;padding:14px 20px 10px;font-size:25px}
table.gap td{padding:11px 20px 8px;border-top:1px solid var(--line);vertical-align:middle;line-height:1.4}
table.gap td:first-child{font-family:var(--display);font-weight:700;width:36%}
table.gap td [contenteditable]{display:block;border-bottom:none;color:var(--ink-2);min-height:1.4em}
.status{border:0;border-radius:999px;padding:7px 16px 4px;font-size:22px;font-weight:800;font-family:var(--display);white-space:nowrap;min-width:140px}
.status[data-s="0"]{background:#EEF1F6;color:var(--muted)}
.status[data-s="1"]{background:#E2F4EB;color:var(--ok)}
.status[data-s="2"]{background:#FFF1CC;color:#7A5200}
.status[data-s="3"]{background:#FBE4E7;color:var(--bad)}
.gauge{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.gauge svg{width:300px;height:180px}
.gauge .pct{font-family:var(--display);font-size:84px;font-weight:800;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.gauge p{font-size:23px;color:var(--muted)}
.gauge .counts{display:flex;gap:10px;font-size:21px;font-weight:700;flex-wrap:wrap;justify-content:center}
.gauge .counts span{padding:4px 14px 2px;border-radius:999px}

/* Quiz */
.quiz{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1}
.qz{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.qz b{font-family:var(--display);font-size:29px;line-height:1.4}
.qz .opts{gap:8px}
.qz .opts button{font-size:26px;padding:10px 18px 6px}
.qz .why{font-size:23px;color:var(--muted);display:none;line-height:1.45}
.qz.done .why{display:block}

/* Proposals */
.props{grid-template-columns:repeat(3,1fr);flex:1}
.props .card{gap:14px}
.props ul{font-size:28.5px;line-height:1.5;color:var(--ink-2);gap:10px}

/* Closing */
.closing{background:linear-gradient(120deg,#FFFFFF,#F2F6FD 60%,#FFF6E3)}
.closing.active{display:grid;grid-template-columns:1fr 1.15fr;gap:70px;padding:70px 120px}
.closing h2{font-size:124px}

/* ===== Motion ===== */
.slide.active.in-next{animation:inNext .6s cubic-bezier(.2,.8,.2,1) both}
.slide.active.in-prev{animation:inPrev .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes inNext{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.head h2{position:relative}

@keyframes icPop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.card,.cr,.st,.type,.sq,.qz,.fc,.vid,.agenda button,.tcards button{transition:translate .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s}
.card:hover,.cr:hover,.st:hover,.type:hover,.sq:hover{translate:0 -6px;box-shadow:0 16px 36px rgba(29,50,117,.14)}
.agenda button:hover .n{animation:wiggle .5s}
@keyframes wiggle{0%,100%{transform:none}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.slide.active .fig img{animation:kenburns 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1)}}
.fig:hover{translate:0 -4px;rotate:-.4deg}
.fig{transition:translate .3s, rotate .3s}
.slide.active .type{animation:flipIn .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 140ms)}
@keyframes flipIn{from{opacity:0;transform:perspective(1200px) rotateY(55deg)}to{opacity:1;transform:none}}
.slide.active #pyr button{animation:tierUp .7s cubic-bezier(.3,1.4,.5,1) both}
.slide.active #pyr button:nth-child(3){animation-delay:.2s}.slide.active #pyr button:nth-child(2){animation-delay:.45s}.slide.active #pyr button:nth-child(1){animation-delay:.7s}
@keyframes tierUp{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:.55;transform:none}}
.slide.active #pyr button.on{animation-name:tierUpOn}
@keyframes tierUpOn{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:scale(1.03)}}
.cover h1 .w{display:inline-block}
.slide.active.cover h1 .w{animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
.slide.active.cover h1 .w:nth-child(2){animation-delay:.25s}
@keyframes drop{from{opacity:0;transform:translateY(-80px) rotate(-6deg)}to{opacity:1;transform:none}}
.slide.active.cover .logo{animation:zoom .9s both}
.slide.active.divider h2{animation:swing 1s cubic-bezier(.3,1.4,.5,1) both;transform-origin:top center}
@keyframes swing{from{opacity:0;transform:rotate(-8deg) translateY(-60px)}to{opacity:1;transform:none}}
.slide.active.divider .steps div{animation:bounceIn .7s cubic-bezier(.3,1.7,.5,1) both}
.slide.active.divider .steps div:nth-child(1){animation-delay:.5s}.slide.active.divider .steps div:nth-child(2){animation-delay:.65s}.slide.active.divider .steps div:nth-child(3){animation-delay:.8s}.slide.active.divider .steps div:nth-child(4){animation-delay:.95s}
@keyframes bounceIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.slide.active .foot .bar i{animation:barGrow 1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes barGrow{from{transform:scaleX(.6);transform-origin:right}to{transform:none}}
.slide.active .bigstat .n,.slide.active .bigstat .n2,.slide.active .es2,.slide.active .causes .big{animation:pulseNum 1.4s .4s both}
@keyframes pulseNum{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:none}}

@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce){.slide.active.in-next,.slide.active.in-prev,.slide.active .card .ic,.slide.active .fig img,.slide.active .type,.slide.active #pyr button,.flip .f .hint svg,.slide.active .head h2::after,.slide.active .tag::after{animation:none!important}}

.slide.active .rframe{animation:rBreath 9s 2s ease-in-out infinite alternate}

.slide.active .head h2::before{animation:coinSpin 1s .2s cubic-bezier(.3,1.4,.5,1) both}
@keyframes coinSpin{from{transform:rotateY(180deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.tag{background:#fff;border:3px solid var(--gold);border-radius:18px}
.subpill{border-radius:18px}
.foot{height:66px;background:linear-gradient(180deg,#1F3A85,#10224F);border-top:5px solid var(--gold);border-radius:60% 60% 0 0/26px 26px 0 0}

/* ===== Unified light background (as in the supplied slides), no clouds/leaves/coin ===== */
.deco{display:none!important}
.slide:not(.fullimg),.slide.cover,.slide.divider,.slide.closing{background:
  repeating-conic-gradient(from 0deg at 50% -20%, rgba(255,255,255,.38) 0deg 3deg, rgba(255,255,255,0) 3deg 10deg),
  radial-gradient(ellipse 120% 90% at 50% 0%, #F6FAFF 0%, #E3EEFB 50%, #D2E4F8 100%)!important}
.cover .art{background:transparent!important}
.head h2::before,.head h2::after{display:none!important}
.slide h2{padding:14px 64px 6px!important}
.foot{border-radius:0!important}

/* ===== Rebuilt ready slides ===== */
.slide.rs{gap:20px;padding-top:56px}
.slide.rs h2 .gold,.gold{color:#E8B730}
.slide.rs .subpill .gold,.deftext .gold,.hlline .gold,.summary .gold{color:#B57F0A}
.smallsub{font-size:24px;color:var(--ink-2);font-weight:700;background:#fff;border:2px solid #D7E4F5;border-radius:14px;padding:6px 22px 2px}
.ico{flex:none}
.gi{--s:84px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:none;color:var(--g);
  background:radial-gradient(circle at 34% 28%,#fff 0%,color-mix(in srgb,var(--g) 18%,white) 45%,color-mix(in srgb,var(--g) 40%,white) 100%);
  border:3px solid #fff;box-shadow:0 8px 18px color-mix(in srgb,var(--g) 30%,transparent), inset 0 -4px 8px color-mix(in srgb,var(--g) 18%,transparent)}
.gi svg{width:52%;height:52%;stroke-width:2}
.gi.sm{--s:52px}.gi.lg{--s:96px}.gi.xl{--s:128px}
.slide.active .gi{animation:icPop .7s cubic-bezier(.3,1.6,.5,1) both, bob 3.8s ease-in-out infinite;animation-delay:calc(var(--i,0)*100ms + .25s), calc(var(--i,0)*100ms + 1.3s)}
.pillh{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,white),var(--c));color:#fff;font-family:var(--display);font-weight:800;font-size:26px;padding:6px 22px 2px;border-radius:999px;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 30%,transparent);line-height:1.3}
.pillh.big{font-size:30px;padding:8px 28px 4px}
.pillh svg{width:30px;height:30px}
.gnum{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--c);font-weight:800;margin-inline-start:-14px;line-height:1;padding-top:3px}
.gc{background:linear-gradient(160deg,var(--p),#fff 88%);border:2px solid var(--pb);border-radius:26px;padding:18px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 24px rgba(29,50,117,.08);transition:translate .25s}
.gc:hover,.pp:hover,.bx:hover{translate:0 -5px}
.gc-b{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.gc-b p{font-size:25px;line-height:1.5;color:var(--ink)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.band{background:#fff;border:3px solid var(--gold);border-radius:26px;padding:34px 24px 14px;position:relative;display:flex;flex-direction:column;gap:10px;margin-top:12px;box-shadow:0 10px 24px rgba(29,50,117,.08)}
.bandt{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#2A4799,#1B2F6E);color:#fff;font-family:var(--display);font-weight:800;font-size:28px;padding:6px 30px 2px;border-radius:999px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.bandt svg{width:30px;height:30px;color:#F2C94C}
.bchips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:14px}
.bchip{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,#F3F8FF,#fff);border:2px solid #D7E4F5;border-radius:16px;padding:8px 14px;font-size:24px;font-weight:700;color:var(--navy);line-height:1.35}
.bnote{align-self:center;display:flex;gap:10px;align-items:center;font-size:25px;font-weight:700;color:var(--navy);background:#F3F8FF;border-radius:999px;padding:6px 26px 2px}
.bnote svg{width:32px;height:32px;color:#E0A82E}
.bsmall{align-self:center;font-size:19px;color:var(--muted)}
.cite{display:block;font-size:19px;color:var(--muted);margin-top:4px}
.srcnote{align-self:center;font-size:20px;color:var(--muted);background:#fff;border-radius:999px;padding:4px 20px 0}
/* definition */
.defwrap{display:flex;flex-direction:column;gap:22px;flex:1}
.defcard{background:#fff;border:2px solid #D7E4F5;border-radius:28px;padding:24px 34px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 24px rgba(29,50,117,.08)}
.defcard:first-child{border-color:#BCD6F7}.defcard:last-child{border:3px solid var(--gold)}
.deftext{font-size:33px;line-height:1.55;color:var(--navy);font-weight:500}
.hlline{font-size:33px;font-weight:800;color:var(--navy);background:linear-gradient(90deg,#E7F1FE,#F6FAFF);border-radius:18px;padding:12px 24px 6px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.tile{background:linear-gradient(160deg,var(--p),#fff 90%);border:2px solid var(--pb);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:28px;color:var(--navy)}
/* prevalence */
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1}
.pcol{background:linear-gradient(170deg,var(--p),#fff 70%);border:2px solid var(--pb);border-radius:28px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;align-items:stretch;box-shadow:0 10px 24px rgba(29,50,117,.08)}
.pch{display:flex;align-items:center;gap:12px;justify-content:center;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,white),var(--c));color:#fff;font-family:var(--display);font-weight:800;font-size:28px;border-radius:20px;padding:8px 16px 4px;line-height:1.3;text-align:center}
.pbig{font-family:var(--display);font-weight:800;font-size:112px;color:var(--c);line-height:1;text-align:center;margin-top:6px}
.pmid{font-family:var(--display);font-weight:800;font-size:66px;color:var(--c);line-height:1}
.pcap{font-size:27px;text-align:center;color:var(--navy);font-weight:700;line-height:1.45}
.pcap.small{font-size:22px;color:var(--ink-2);font-weight:500}
.pchip{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--pb);border-radius:16px;padding:8px 14px;font-size:22.5px;font-weight:700;color:var(--navy);line-height:1.4}
.pchip.warn{background:#FFF0F4;border-color:#F3C3D2}
.pstat{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--pb);border-radius:20px;padding:12px 16px}
.pstat p{font-size:23px;font-weight:700;color:var(--navy);margin:4px 0!important}
.tagchip{display:inline-block;background:color-mix(in srgb,var(--c,#D98A1C) 12%,white);color:var(--ink-2);border-radius:999px;font-size:19px;padding:3px 14px 0;font-weight:700}
/* evolution */
.evtop{display:flex;align-items:center;justify-content:center;gap:26px}
.bridge{background:#fff;border:2px solid #D7E4F5;border-radius:24px;padding:14px 34px 8px;font-family:var(--display);font-weight:800;font-size:36px;color:var(--navy);box-shadow:0 10px 24px rgba(29,50,117,.08);margin-inline-end:20px}
.bridge span{color:#C98A10}
.evrow{display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr 60px 1fr;align-items:center;flex:1}
.evc{height:100%;background:linear-gradient(170deg,var(--p),#fff 80%);border:2px solid var(--pb);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 10px 24px rgba(29,50,117,.08)}
.evc .pillh{align-self:center}
.evc h3{font-size:32px;color:var(--navy)}
.evd{margin-top:auto!important;background:#fff;border:2px solid var(--pb);border-radius:18px;padding:12px 14px 8px;font-size:25px;font-weight:700;color:var(--navy);align-self:stretch;line-height:1.45}
.evarrow{display:grid;place-items:center;color:#2F6FD6}
.evarrow svg{width:52px;height:52px;stroke-width:3}
.slide.active .evarrow{animation:rise .6s both, nudge 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*100ms),calc(var(--i)*100ms + .8s)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
/* models */
.arabmodel{display:flex;align-items:center;gap:22px;background:linear-gradient(90deg,#E7F1FE,#fff 70%);border:3px solid var(--gold);border-radius:26px;padding:14px 26px}
.arabmodel h3{font-size:34px;color:var(--navy)}.arabmodel p{font-size:25px;color:var(--ink)}
.ppgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1}
.pp{background:linear-gradient(160deg,var(--p),#fff 88%);border:2px solid var(--pb);border-radius:24px;padding:14px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;transition:translate .25s}
.pp h3{font-size:30px;color:var(--navy);margin-bottom:4px!important}.pp p{font-size:22.5px;line-height:1.45;color:var(--ink)}
.slide#r03 .band{margin-top:14px;padding-top:30px}
/* lit review */
.udl{display:flex;align-items:center;gap:20px;background:#fff;border:2px solid #BCD6F7;border-radius:22px;padding:10px 22px}
.udl b{font-size:28px;color:var(--navy);font-family:var(--display)}.udl p{font-size:23px;color:var(--ink-2)}
.udl .tagchip{margin-inline-start:auto;white-space:nowrap}
.gt{display:grid;gap:6px;flex:1;align-content:stretch}
.gt .th{background:linear-gradient(180deg,#2F6FD6,#1D4CA8);color:#fff;font-family:var(--display);font-weight:800;font-size:26px;text-align:center;padding:10px 12px 6px;border-radius:14px}
.gt .td{background:linear-gradient(160deg,var(--p),#fff 90%);border:2px solid var(--pb);border-radius:14px;padding:10px 16px;font-size:22.5px;line-height:1.45;color:var(--ink);display:flex;flex-direction:column;justify-content:center}
.gt .td.first{flex-direction:row;align-items:center;gap:12px}
.gt .td.first b{font-family:var(--display);font-size:25px;color:var(--navy);line-height:1.3}
.summary{display:flex;gap:26px;align-items:center;background:#fff;border:3px solid var(--gold);border-radius:28px;padding:26px 34px;box-shadow:0 10px 24px rgba(29,50,117,.08)}
.summary p{font-size:32px;line-height:1.6;color:var(--navy);margin-top:12px!important}
.roadt{align-self:center;font-family:var(--display);font-weight:800;font-size:32px;color:#fff;background:linear-gradient(180deg,#2A4799,#1B2F6E);padding:8px 36px 4px;border-radius:999px}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1}
.rc{background:linear-gradient(170deg,var(--p),#fff 85%);border:2px solid var(--pb);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.rc .pillh{align-self:center}.rc p{font-size:28px;color:var(--navy);font-weight:700;line-height:1.5}
/* visit */
.axest{align-self:center;font-size:27px;color:var(--navy);background:#fff;border:2px solid #D7E4F5;border-radius:999px;padding:6px 30px 2px}
.slide#r09 .g2{flex:1}.slide#r09 .gc-b p{font-size:28px}
.wide{display:flex;align-items:center;gap:22px;justify-content:center;background:#fff;border:3px solid var(--gold);border-radius:26px;padding:14px 26px}
.wide h3{font-size:34px;color:var(--navy)}.wide p{font-size:26px;color:var(--ink)}
.g2.tall{flex:1}
.bx{background:linear-gradient(165deg,var(--p),#fff 80%);border:2px solid var(--pb);border-radius:26px;padding:16px 24px;display:flex;flex-direction:column;gap:8px;transition:translate .25s}
.bxh{display:flex;justify-content:space-between;align-items:center}
.bx ul{margin:0;padding:0 26px 0 0;display:flex;flex-direction:column;gap:3px;font-size:23px;line-height:1.4;color:var(--ink)}
.bx li::marker{color:var(--c)}
.slide.active .bx li{animation:rise .45s both;animation-delay:calc(var(--i)*120ms + var(--j,0)*70ms + .2s)}
/* insight */
.insight{display:flex;gap:18px;align-items:center;background:#fff;border:3px solid var(--gold);border-radius:22px;padding:12px 22px}
.insight p{font-size:22.5px;line-height:1.5;color:var(--navy)}
.insight .pillh{white-space:nowrap}

/* ===== Illustrated icons (same look as slide 17) ===== */
.gi.img{background:#fff;border:4px solid #fff;overflow:hidden;padding:0;box-shadow:0 10px 22px rgba(29,50,117,.18)}
.gi.img img{width:100%;height:100%;object-fit:cover;display:block}
.slide.rs .gc .gi.img{--s:124px}
.slide.rs .bchip .gi.img{--s:60px}
.slide.rs .pch .gi.img{--s:62px;margin-block:-8px}
.slide.rs .pchip .gi.img,.slide.rs .bxh .gi.img{--s:58px}
.slide.rs .bxh .gi.img{--s:84px}
.slide.rs .pstat .gi.img{--s:104px}
.tile .gi.img{--s:118px}
.evc .gi.img.xl{--s:200px}
.rc .gi.img.xl{--s:150px}
.gt .td.first .gi.img{--s:66px}
.udl .gi.img,.summary .gi.img,.arabmodel .gi.img,.wide .gi.img{--s:100px}
.pp .gi.img{--s:118px}
.scene-sm{height:190px;border-radius:24px;border:4px solid var(--gold);box-shadow:0 12px 26px rgba(29,50,117,.2);margin-inline-end:10px}
.evtop .gi.img{--s:92px}
.defcard:first-child{position:relative;padding-left:480px}
.defscene{position:absolute!important;left:22px;top:50%;transform:translateY(-50%);width:430px;border-radius:24px;border:4px solid var(--gold);box-shadow:0 12px 26px rgba(29,50,117,.2)}
.slide.active .defscene{animation:zoom .8s .3s both}
.prevfoot{display:flex;align-items:center;justify-content:center;gap:24px}
.prevfoot img{height:150px;border-radius:22px;border:4px solid var(--gold);box-shadow:0 10px 22px rgba(29,50,117,.18)}
.slide#r11 .prev{flex:1}
.visitband{display:grid;grid-template-columns:330px 1fr 330px;gap:20px;align-items:center}
.vscene{width:100%;border-radius:22px;border:4px solid var(--gold);box-shadow:0 10px 22px rgba(29,50,117,.18)}
.slide.rs .g3{flex:1}
.slide.rs .g3 .gc{justify-content:center}
.slide.rs .g3 .gc-b p{font-size:27px}
.slide.rs .g3 .gi{--s:96px}
.slide.rs .band .bchip{font-size:25px}
.evc .gi.xl{--s:170px}.evc h3{font-size:36px}.evd{font-size:27px}
.slide#r06 .bx ul{font-size:26px;gap:6px}
.slide#r06 .bx{padding:18px 26px}
.slide#r09 .gc{justify-content:center}.slide#r09 .gi{--s:110px}
.slide#r10{gap:14px}
.slide#r10 .gt{gap:5px}
.slide#r10 .gt .td{font-size:21.5px;padding:6px 14px;line-height:1.4}
.slide#r10 .gt .th{padding:6px 12px 2px;font-size:24px}
.slide#r10 .cite{font-size:17px;margin-top:2px}
.slide#r10 .insight{padding:8px 20px}.slide#r10 .insight p{font-size:21.5px}
.slide#r01 .gt .td{font-size:23px}
.ppgrid .pp p{font-size:23.5px}

.slide#r06 .head{gap:6px}
.slide#r06 .bx ul{font-size:24.5px!important;gap:4px!important}

/* final sizing for illustrated icons */
section.slide.rs .gc .gi.img{--s:124px}
section.slide#r09 .gc .gi.img{--s:150px}
section.slide.rs .bxh .gi.img{--s:76px}
section.slide.rs .gt .td.first .gi.img{--s:70px}
section.slide#r06 .bx ul{font-size:23px!important;gap:2px!important}
section.slide#r06 .bx{padding:12px 22px!important;gap:4px}
section.slide#r06 .g2{gap:14px}
.defcard:first-child{min-height:300px;justify-content:center}
.defscene{width:440px;height:calc(100% - 40px);object-fit:cover}
.prevfoot img{height:170px}
.defscene{top:18px!important;bottom:18px;height:auto!important;transform:none!important;width:400px!important}
.defcard:first-child{padding-left:450px!important;min-height:280px}

.foot .flogo{display:none!important}
.foot .ft{color:#F7C948!important;font-family:var(--display);font-weight:800;font-size:25px!important;margin:0 auto;padding-bottom:6px}
.foot .ft i{background:#F7C948!important;width:46px!important}
.foot .pg{color:#fff!important;font-weight:800;padding-bottom:8px;min-width:0!important}
.foot .bar{display:none}

/* illustrated icons: free-standing 3D cut-outs, no circles */
.gi.img,.slide.rs .gi.img{background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important}
.gi.img img{object-fit:contain!important;filter:drop-shadow(0 8px 10px rgba(29,50,117,.22))}
.divider .steps img{border-radius:0!important;border:0!important;box-shadow:none!important;object-fit:contain!important;filter:drop-shadow(0 6px 8px rgba(29,50,117,.2))}

/* scenes: cut-out characters, no frames */
.scene-sm,.defscene,.prevfoot img,.vscene,.closeimg,.divimg,.cover .art .scene,.relscene,.ig img.scene{border:0!important;border-radius:0!important;box-shadow:none!important;background:none!important;object-fit:contain!important;filter:drop-shadow(0 14px 18px rgba(29,50,117,.2))}

/* cards: softer, rounder */
.card,.gc,.pcol,.evc,.bx,.pp,.rc,.defcard,.summary,.band,.wide,.udl,.arabmodel,.insight{border-radius:30px!important}
.card,.defcard,.summary{background:rgba(255,255,255,.94)!important}
.bandt,.roadt{background:linear-gradient(180deg,#4A8AEC,#1C52BE)!important;border:3px solid #fff!important;box-shadow:0 8px 18px rgba(28,82,190,.3)!important;font-family:var(--title)!important;font-weight:800!important}
.pillh{border:2px solid #fff}

/* cover (like the PowerPoint cover) */
.cover.active{display:grid!important;grid-template-columns:1fr 760px!important}
.cover .txt{padding:40px 70px 150px 30px!important;gap:24px!important;align-items:stretch}
.cover .logo{display:none!important}
.cover .eyebrow{align-self:center;font-size:30px!important;color:var(--navy)!important}
.cover .eyebrow::before{display:none}

.slide.active.cover h1.cover-ribbon::before{animation:medalIn 1s .2s cubic-bezier(.3,1.5,.5,1) both}
.cover .sub{text-align:center;border:2px solid #D6E6F8!important;border-radius:30px!important;font-weight:700!important;color:var(--navy)!important;background:rgba(255,255,255,.95)!important;font-size:34px!important}
.cover .meta{align-self:flex-end;border:3px solid #E6C45C!important;border-radius:30px!important;background:rgba(234,244,253,.96)!important;min-width:620px}
.cover .meta span:nth-child(odd){color:#2F6FD6!important}
.cover .art{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:24px 30px 150px}
.cover .art .coverlogo{position:relative;z-index:3;width:440px;background:#fff;border-radius:34px;padding:16px 22px;box-shadow:0 12px 28px rgba(29,50,117,.16);align-self:flex-start;margin-left:0}
.cover .art .coverlogo img{width:100%;display:block}
.cover .art .scene{position:relative!important;left:auto!important;right:auto!important;top:auto!important;transform:none!important;width:100%!important;margin-top:auto}
.cover canvas{display:none}

/* divider */
.divider{padding:18px 120px 140px!important;justify-content:center}
.slide.divider h2{font-family:var(--title)!important;font-size:110px!important;background:linear-gradient(180deg,#2C4AA4,#0E205E)!important;border:7px solid #E2B236!important;border-radius:999px!important;padding:24px 90px 8px!important}
.divider .steps div{background:rgba(255,255,255,.95)!important}
.divider .steps img{width:84px!important;height:84px!important}

/* closing */
.closing.active{padding:30px 90px 150px!important}
.closing h2{font-family:var(--title)!important;font-size:120px!important;color:#fff!important;background:linear-gradient(180deg,#2C4AA4,#0E205E)!important;border:7px solid #E2B236!important;border-radius:999px!important;padding:20px 80px 6px!important;box-shadow:0 18px 36px rgba(14,32,94,.35)!important;align-self:flex-start;text-align:center}
.closing h2 span{color:#F7C948}
.closing .refs{background:rgba(255,255,255,.95)!important;border:3px solid #E6C45C!important;border-radius:30px!important}
.closing .closelogo{width:400px;background:#fff;border-radius:30px;padding:14px 20px;box-shadow:0 12px 28px rgba(29,50,117,.16)}
.closing .closelogo img{width:100%;display:block}

/* --- fixes --- */
#chrome{top:auto!important;bottom:10px!important;left:50%!important;transform:translateX(-50%);opacity:0!important}
#chrome:hover,#chrome:focus-within{opacity:1!important}
.slide .head h2,.slide.rs .head h2{display:block!important;padding:34px 56px 24px 190px!important;min-height:0!important}
.slide .head .task-badge{order:1;align-self:center!important;border:3px solid #D4A017!important;background:#fff!important;font-size:25px!important;padding:6px 30px 2px!important}
.cover h1.cover-ribbon{white-space:nowrap;font-size:104px!important;padding:26px 50px 10px 180px!important}
.slide .head h2.long,.slide.rs .head h2.long{font-size:41px!important;padding-top:40px!important;padding-bottom:30px!important}
.slide .head{display:flex!important;flex-direction:column!important}
.slide .head > :not(h2):not(.tag):not(.subpill):not(.smallsub):not(.task-badge){order:3}
section.slide#r09 .gc .gi.img{--s:104px}
.slide#r09 .vscene{max-height:150px;width:auto!important;justify-self:center}
.slide#r09 .g2{gap:14px}
.slide#r01 .gt .td{font-size:21px!important;padding:6px 14px!important}
.slide#r01b .road{flex:0 1 auto}
.setttop{flex-direction:column!important;align-items:stretch!important;gap:8px!important}
.setttop > :not(.head){align-self:flex-start;margin-top:-56px}

.slide.nologo .head{margin-left:0!important;align-items:center!important}
.slide.nologo .head h2{align-self:center;min-width:1100px;max-width:1500px}
.slide.t2 .head{gap:8px!important}

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k){ try { return localStorage.getItem('ld-deck:' + k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem('ld-deck:' + k, v); } catch(e){} }
};
const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

const stage = $('#stage');
function fit(){ const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hooks = {};
function runCounts(sl){
  $$('.count', sl).forEach(el => {
    const to = parseFloat(el.dataset.to), dec = +(el.dataset.dec || 0);
    if (REDUCE){ el.textContent = el.dataset.sep ? to.toLocaleString('en-US') : to.toFixed(dec); return; }
    const t0 = performance.now() + 350, dur = 1300;
    el.textContent = (0).toFixed(dec);
    const step = t => { const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3); el.textContent = el.dataset.sep ? Math.round(to * e).toLocaleString('en-US') : (to * e).toFixed(dec); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* Attention */
let audio = null;
function noise(on){
  try {
    if (on){
      if (!audio){
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
        let last = 0; for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }
        const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        const g = ac.createGain(); g.gain.value = .5;
        const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .35; lg.gain.value = .25; lfo.connect(lg); lg.connect(g.gain);
        src.connect(g); g.connect(ac.destination); src.start(); lfo.start(); audio = ac;
      } else audio.resume();
    } else if (audio) audio.suspend();
  } catch(e){}
}
(() => {
  const sentence = $('#attSentence'), raw = sentence.textContent;
  const count = [...raw].filter(c => c === 'ع').length;
  const box = $('#attBox'); let tv = null, dv = null, left = 20, noiseOn = false;
  const msgs = ['أسرع!','هل انتهيت؟','انتبه!','الجرس بعد قليل','من أخذ قلمي؟','٣ + ٤ = ؟','اهدأوا يا شباب','افتحوا الكتاب'];
  const colors = ['#FFE08A','#FFD0D5','#CFE3FF','#D5F2E3','#E6DBFF'];
  const pad = $('#attPad');
  for (let n = count - 4; n <= count + 3; n++) pad.insertAdjacentHTML('beforeend', `<button data-n="${n}">${n}</button>`);
  function popD(){ const s = document.createElement('span'); s.className = 'distr'; s.textContent = msgs[Math.floor(Math.random() * msgs.length)]; s.style.background = colors[Math.floor(Math.random() * colors.length)]; s.style.right = (5 + Math.random() * 70) + '%'; s.style.top = (5 + Math.random() * 75) + '%'; box.appendChild(s); setTimeout(() => s.remove(), 2700); }
  function floaties(on){ $$('.floaty', box).forEach(f => f.remove()); if (!on) return; for (let i = 0; i < 6; i++){ const f = document.createElement('span'); f.className = 'floaty'; const sz = 60 + Math.random() * 120; f.style.width = f.style.height = sz + 'px'; f.style.background = colors[i % colors.length]; f.style.right = Math.random() * 70 + '%'; f.style.top = Math.random() * 60 + '%'; f.style.animationDuration = (5 + Math.random() * 5) + 's'; f.style.animationDelay = (-Math.random() * 5) + 's'; box.appendChild(f); } }
  function stop(){ clearInterval(tv); clearInterval(dv); tv = dv = null; floaties(false); $$('.distr', box).forEach(d => d.remove()); }
  function reset(){ stop(); left = 20; $('#attTimer').textContent = '0:20'; $('#attVeil').style.display = ''; sentence.textContent = raw; $('#attFb').textContent = ''; $$('button', pad).forEach(b => { b.className = ''; b.disabled = false; }); }
  $('#attStart').onclick = () => { $('#attVeil').style.display = 'none'; floaties(true); popD(); dv = setInterval(popD, 1400); tv = setInterval(() => { left--; $('#attTimer').textContent = '0:' + String(Math.max(0, left)).padStart(2, '0'); if (left <= 0){ clearInterval(tv); clearInterval(dv); } }, 1000); };
  $$('button', pad).forEach(b => b.onclick = () => {
    stop(); const n = +b.dataset.n;
    $$('button', pad).forEach(x => { x.disabled = true; if (+x.dataset.n === count) x.classList.add('right'); });
    if (n !== count) b.classList.add('wrong'); else confetti(b);
    sentence.innerHTML = raw.replace(/ع/g, '<mark class="ain">ع</mark>');
    $('#attFb').textContent = n === count ? `صحيح: ${count} مرات. كم مرة أعدتم العدّ؟` : `العدد الصحيح ${count}. المشتتات تسرق الانتباه دون أن نشعر.`;
    $('#attFb').style.color = n === count ? 'var(--ok)' : 'var(--bad)';
